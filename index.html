t-size:clamp(16px,2.7vw,23px)}.arrows{display:flex;justify-content:space-between;font-size:13px;color:#786d83;gap:8px}.options{display:grid;gap:11px;margin:22px 0}.option{background:white;border:2px solid #e2d8ed;border-radius:13px;padding:15px;text-align:left;font:inherit;font-weight:700;color:#463855;cursor:pointer}.option:hover,.option:focus-visible{border-color:#b89bd9;background:#fbf7ff}.option.selected{border-color:#9670cc;background:#f3eaff}.feedback{padding:16px 19px;border-radius:14px;margin-top:14px;font-size:16px}.feedback.good{background:#eaf9ef;border:1px solid #9ed9b6}.feedback.try{background:#fff2e9;border:1px solid #f2c9aa}.digits{display:flex;justify-content:center;gap:12px;margin:22px 0}.digit{display:grid;place-items:center;background:#f1eaf9;border:2px solid #ded0ee;border-radius:13px;width:60px;height:66px;font-size:29px;font-weight:900}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:30px}.btn{background:#eee5f9;color:#49365e;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:800;cursor:pointer}.btn.primary{background:#ad8bda;color:white}.btn:disabled{opacity:.35;cursor:not-allowed}.center{text-align:center}.hero{font-size:70px;margin:16px}.print-note{font-size:13px;color:#786d83;margin-top:12px}.footer{text-align:center;font-size:12px;color:#84798f;margin-top:15px}li{margin:7px 0}strong{color:#513a69}@media(max-width:500px){.wrap{padding:12px}.shell{padding:18px;min-height:510px}.rung{padding:10px 1px}.grid{gap:6px}.unit{padding:12px 3px;font-size:13px}.btn{padding:12px 15px}.digit{width:48px;height:56px}}

<script>
(()=>{'use strict';
const ladder=`<div class="ladder" aria-label="Metric ladder from kilo to milli">${[['k','Kilo'],['h','Hecto'],['da','Deka'],['BASE','m / L / g'],['d','Deci'],['c','Centi'],['m','Milli']].map(([short,name])=>`<div class="rung"><b>${short}</b>${name}</div>`).join('')}</div><div class="arrows"><span>← Bigger units: divide by 10 each step</span><span>Smaller units: multiply by 10 each step →</span></div>`;
const slides=[
{"tag":"MISSION BRIEFING","title":"Metric Mission: Crack the Code","html":"<div class=\"center\"><div class=\"hero\">🔐🧪</div><h2>The research lab is locked!</h2><p>Complete five science training levels to recover the secret four-digit code.</p></div><div class=\"soft pink\"><strong>Mission plan • about 40 minutes</strong><ol><li>Metric system review • 7 minutes</li><li>Metric ladder training • 8 minutes</li><li>Conversion practice • 12 minutes</li><li>Science application • 6 minutes</li><li>Final code challenge • 7 minutes</li></ol></div>"},
{"tag":"YOUR NOTEBOOK","title":"Set Up Your Scientist Notes","html":"<p>On paper, title your page <strong>Metric Mission Notes</strong>. You will record:</p><ol><li>The metric system and three base units</li><li>Which measurement tools to use</li><li>The seven-step metric ladder</li><li>Two decimal-moving rules</li><li>Two worked examples</li></ol><div class=\"soft mint\">✏️ For <strong>every practice question</strong>, write your answer and work <em>before</em> clicking. Keep this paper to turn in if your teacher asks.</div>"},
{"tag":"LEVEL 1 • REVIEW","title":"What Is the Metric System?","html":"<p>Scientists use the <strong>metric system</strong> to measure things consistently. It is based on powers of <strong>10</strong>.</p><div class=\"grid\"><div class=\"unit\"><div class=\"emoji\">📏</div><strong>Meter (m)</strong>Length</div><div class=\"unit\"><div class=\"emoji\">⚖️</div><strong>Gram (g)</strong>Mass</div><div class=\"unit\"><div class=\"emoji\">🧪</div><strong>Liter (L)</strong>Volume</div></div><div class=\"soft pink\">✏️ Notes: meter = length; gram = mass; liter = liquid volume. <strong>Milli-</strong> means 1/1,000; <strong>centi-</strong> means 1/100; <strong>kilo-</strong> means 1,000.</div>"},
{"tag":"REVIEW 01","title":"Choose the Measurement","q":"A scientist wants to measure the LENGTH of a pencil. Which metric unit makes the most sense?","options":["Grams (g)", "Centimeters (cm)", "Milliliters (mL)"],"correct":1,"explanation":"Centimeters are a unit of length, useful for small objects like pencils."},
{"tag":"REVIEW 02","title":"Choose the Measurement","q":"Which metric unit would you use to measure the MASS of an apple?","options":["Grams (g)", "Liters (L)", "Meters (m)"],"correct":0,"explanation":"Grams measure mass. Liters measure volume, and meters measure length."},
{"tag":"REVIEW 03","title":"Choose the Measurement","q":"A student pours water into a beaker. Which unit best describes the water VOLUME?","options":["Kilograms (kg)", "Centimeters (cm)", "Milliliters (mL)"],"correct":2,"explanation":"Milliliters are used for small amounts of liquid volume."},
{"tag":"LEVEL 1 • TOOLS","title":"Match the Tool to the Job","html":"<div class=\"grid\"><div class=\"unit\"><div class=\"emoji\">📏</div><strong>Ruler</strong>Length</div><div class=\"unit\"><div class=\"emoji\">⚖️</div><strong>Balance</strong>Mass</div><div class=\"unit\"><div class=\"emoji\">🧪</div><strong>Graduated cylinder</strong>Liquid volume</div></div><div class=\"soft\">✏️ Notes: Copy the three tool-and-measurement matches. A <strong>thermometer</strong> measures temperature, not mass or volume.</div>"},
{"tag":"REVIEW 04","title":"Choose the Lab Tool","q":"Which tool would you use to measure 35 mL of water most accurately?","options":["Graduated cylinder", "Meter stick", "Digital balance"],"correct":0,"explanation":"A graduated cylinder has marked volume measurements in milliliters."},
{"tag":"REVIEW 05","title":"Choose the Lab Tool","q":"Which tool measures the mass of a rock?","options":["Ruler", "Digital balance", "Thermometer"],"correct":1,"explanation":"A digital balance measures mass, commonly in grams."},
{"tag":"LEVEL 2 • TRAINING","title":"The Metric Conversion Ladder",html:`<p>Each step between neighboring prefixes changes the number by a factor of <strong>10</strong>.</p>${ladder}<div class="soft pink">✏️ Copy the ladder onto your notes. The <strong>BASE</strong> column stands for meters, liters, or grams. Circle it.</div>`},
{"tag":"LEVEL 2 • TRAINING","title":"The Two Golden Rules",html:`${ladder}<div class="grid" style="grid-template-columns:1fr 1fr"><div class="soft pink"><strong>← LEFT</strong><br>Divide by 10 each step.<br>Move decimal LEFT.</div><div class="soft mint"><strong>RIGHT →</strong><br>Multiply by 10 each step.<br>Move decimal RIGHT.</div></div><p>✏️ Write both rules. <strong>Always count steps</strong> from the starting prefix to the ending prefix.</p>`},
{"tag":"LADDER 01","title":"Find Your Direction","q":"To convert meters (base) to centimeters (centi), which way do you move on the ladder?","options":["Left 2 steps", "Right 2 steps", "Right 3 steps"],"correct":1,"explanation":"From base to deci to centi is two steps to the right."},
{"tag":"LADDER 02","title":"Find Your Direction","q":"To convert milligrams (milli) to grams (base), which way do you move?","options":["Left 3 steps", "Right 3 steps", "Left 2 steps"],"correct":0,"explanation":"Milli → centi → deci → base is three steps left."},
{"tag":"LADDER 03","title":"Understand Prefixes","q":"Which measurement is the SAME length as 1 meter?","options":["10 centimeters", "100 centimeters", "1,000 centimeters"],"correct":1,"explanation":"Centi means one-hundredth, so 100 centimeters make 1 meter."},
{"tag":"LEVEL 2 • EXAMPLE","title":"Example A: Moving Right",html:`${ladder}<div class="soft"><h2>Convert 4 meters to centimeters.</h2><ol><li>Start at <strong>base</strong> (meters).</li><li>Move <strong>2 steps right</strong> to centi.</li><li>Move the decimal 2 places right: 4.0 → 400.</li></ol><h2>4 m = 400 cm ✓</h2></div><p>✏️ Copy this complete example, including the number of steps.</p>`},
{"tag":"LEVEL 2 • EXAMPLE","title":"Example B: Moving Left",html:`${ladder}<div class="soft"><h2>Convert 2,500 milliliters to liters.</h2><ol><li>Start at <strong>milli</strong>.</li><li>Move <strong>3 steps left</strong> to base.</li><li>Move the decimal 3 places left: 2500. → 2.500.</li></ol><h2>2,500 mL = 2.5 L ✓</h2></div><p>✏️ Copy this complete example, including the number of steps.</p>`},
{"tag":"LEVEL 3 • PRACTICE","title":"Conversion Training Begins","html":"<div class=\"center\"><div class=\"hero\">🧠📐</div><h2>Time to train!</h2></div><div class=\"soft mint\">For each problem: <strong>1.</strong> Write the starting and ending units. <strong>2.</strong> Count ladder steps. <strong>3.</strong> Move the decimal. <strong>4.</strong> Include the unit in your answer. Click only after you solve it on paper.</div>"},
{"tag":"PRACTICE 01","title":"Conversion Challenge","q":"Convert 7 m to cm.","options":["70 cm", "700 cm", "7,000 cm"],"correct":1,"explanation":"Base to centi is two steps right: 7 × 100 = 700 cm."},
{"tag":"PRACTICE 02","title":"Conversion Challenge","q":"Convert 5,000 mg to g.","options":["5 g", "50 g", "0.5 g"],"correct":0,"explanation":"Milli to base is three steps left: 5,000 ÷ 1,000 = 5 g."},
{"tag":"PRACTICE 03","title":"Conversion Challenge","q":"Convert 0.8 L to mL.","options":["80 mL", "800 mL", "8,000 mL"],"correct":1,"explanation":"Base to milli is three steps right: 0.8 × 1,000 = 800 mL."},
{"tag":"PRACTICE 04","title":"Conversion Challenge","q":"Convert 360 cm to m.","options":["36 m", "0.36 m", "3.6 m"],"correct":2,"explanation":"Centi to base is two steps left: 360 ÷ 100 = 3.6 m."},
{"tag":"PRACTICE 05","title":"Conversion Challenge","q":"Convert 2.4 kg to g.","options":["240 g", "2,400 g", "24,000 g"],"correct":1,"explanation":"Kilo to base is three steps right: 2.4 × 1,000 = 2,400 g."},
{"tag":"PRACTICE 06","title":"Conversion Challenge","q":"Convert 45 mm to cm.","options":["4.5 cm", "0.45 cm", "450 cm"],"correct":0,"explanation":"Milli to centi is one step left: 45 ÷ 10 = 4.5 cm."},
{"tag":"PRACTICE 07","title":"Conversion Challenge","q":"Convert 6.2 dL to mL.","options":["62 mL", "620 mL", "6,200 mL"],"correct":1,"explanation":"Deci to milli is two steps right: 6.2 × 100 = 620 mL."},
{"tag":"PRACTICE 08","title":"Conversion Challenge","q":"Convert 0.035 km to m.","options":["35 m", "350 m", "3.5 m"],"correct":0,"explanation":"Kilo to base is three steps right: 0.035 × 1,000 = 35 m."},
{"tag":"PRACTICE 09","title":"Conversion Challenge","q":"Convert 940 g to kg.","options":["9.4 kg", "0.94 kg", "0.094 kg"],"correct":1,"explanation":"Base to kilo is three steps left: 940 ÷ 1,000 = 0.94 kg."},
{"tag":"PRACTICE 10","title":"Conversion Challenge","q":"Convert 12.5 cm to mm.","options":["1.25 mm", "125 mm", "1,250 mm"],"correct":1,"explanation":"Centi to milli is one step right: 12.5 × 10 = 125 mm."},
{"tag":"PRACTICE 11","title":"Conversion Challenge","q":"Convert 0.09 m to cm.","options":["9 cm", "90 cm", "0.9 cm"],"correct":0,"explanation":"Base to centi is two steps right: 0.09 × 100 = 9 cm."},
{"tag":"PRACTICE 12","title":"Conversion Challenge","q":"Convert 7,500 mL to L.","options":["75 L", "0.75 L", "7.5 L"],"correct":2,"explanation":"Milli to base is three steps left: 7,500 ÷ 1,000 = 7.5 L."},
{"tag":"LEVEL 4 • APPLY","title":"Science Lab Scenarios","html":"<div class=\"center\"><div class=\"hero\">🔬</div><h2>Use conversions like a scientist.</h2></div><div class=\"soft pink\">The next questions involve lab measurements and comparisons. Some require more than one step. Show your work before choosing.</div>"},
{"tag":"LAB SCENARIO 01","title":"Think Like a Scientist","q":"A graduated cylinder contains 1.25 L of water. How many milliliters is that?","options":["125 mL", "1,250 mL", "12,500 mL"],"correct":1,"explanation":"Liters to milliliters is three steps right: 1.25 × 1,000 = 1,250 mL."},
{"tag":"LAB SCENARIO 02","title":"Think Like a Scientist","q":"A mineral sample has a mass of 0.075 kg. What is its mass in grams?","options":["7.5 g", "75 g", "750 g"],"correct":1,"explanation":"Kilograms to grams is three steps right: 0.075 × 1,000 = 75 g."},
{"tag":"LAB SCENARIO 03","title":"Think Like a Scientist","q":"Two wires measure 75 cm and 0.8 m. Which is longer?","options":["The 75 cm wire", "The 0.8 m wire", "They are the same length"],"correct":1,"explanation":"0.8 m = 80 cm, which is 5 cm longer than 75 cm."},
{"tag":"LAB SCENARIO 04","title":"Think Like a Scientist","q":"A student needs 500 mL of water but has 0.3 L. How many MORE milliliters are needed?","options":["200 mL", "300 mL", "800 mL"],"correct":0,"explanation":"0.3 L = 300 mL. The difference is 500 − 300 = 200 mL."},
{"tag":"LAB SCENARIO 05","title":"Think Like a Scientist","q":"A lab table is 1.4 m long. What is its length in centimeters?","options":["14 cm", "140 cm", "1,400 cm"],"correct":1,"explanation":"Meters to centimeters is two steps right: 1.4 × 100 = 140 cm."},
{"tag":"LAB SCENARIO 06","title":"Think Like a Scientist","q":"A sample weighs 850 g. Which value is equal to its mass?","options":["8.5 kg", "0.85 kg", "0.085 kg"],"correct":1,"explanation":"Grams to kilograms is three steps left: 850 ÷ 1,000 = 0.85 kg."},
{"tag":"LEVEL 5 • FINAL MISSION","title":"The Locked Research Lab","html":"<div class=\"center\"><div class=\"hero\">🔒</div><h2>Four locks. Four final puzzles.</h2><p>Each correct answer reveals a secret code digit.</p></div><div class=\"soft mint\">Use your notebook, show every step, and unlock the lab. These questions mix everything you have learned.</div>"},
{"tag":"LOCK 01","title":"Unlock Code: Digit 1","q":"Convert 3.5 meters into centimeters.","options":["35 cm", "350 cm", "3,500 cm"],"correct":1,"explanation":"Base to centi: two steps right, so 3.5 × 100 = 350 cm.","digit":"7"},
{"tag":"LOCK 02","title":"Unlock Code: Digit 2","q":"Convert 2,400 milliliters into liters.","options":["24 L", "2.4 L", "0.24 L"],"correct":1,"explanation":"Milli to base: three steps left, so 2,400 ÷ 1,000 = 2.4 L.","digit":"2"},
{"tag":"LOCK 03","title":"Unlock Code: Digit 3","q":"Convert 0.6 kilograms into grams.","options":["60 g", "6,000 g", "600 g"],"correct":2,"explanation":"Kilo to base: three steps right, so 0.6 × 1,000 = 600 g.","digit":"9"},
{"tag":"LOCK 04","title":"Unlock Code: Digit 4","q":"Convert 85 centimeters into meters.","options":["0.85 m", "8.5 m", "0.085 m"],"correct":0,"explanation":"Centi to base: two steps left, so 85 ÷ 100 = 0.85 m.","digit":"4"},
{"tag":"MISSION COMPLETE","title":"Research Lab Unlocked!","html":"<div class=\"center\"><div class=\"hero\">🏆🔓</div><h2>You cracked the code: 7294!</h2><p>Mission complete — excellent scientific thinking!</p></div><div class=\"soft mint\"><strong>Before you finish:</strong><ol><li>Check that your notes include units, tools, ladder, rules, and two examples.</li><li>Make sure your practice calculations are shown on paper.</li><li>Write the four-digit code at the bottom of your notes.</li><li>Turn in your work as your teacher directs.</li></ol></div>"}
];
let index=0;const answers={};const completed={};const slideEl=document.getElementById('slide'),next=document.getElementById('next'),prev=document.getElementById('prev');
function render(){const s=slides[index];document.getElementById('count').textContent=String(index+1).padStart(2,'0')+' / '+slides.length;document.getElementById('bar').style.width=((index+1)/slides.length*100)+'%';let content=`<div class="tag">${s.tag}</div><h1 class="heading">${s.title}</h1><div class="body">${s.html||''}</div>`;
if(s.q){content+=`<div class="soft pink"><span class="small">✏️ Solve on paper before choosing.</span><h2>${s.q}</h2></div><div class="options">${s.options.map((option,i)=>`<button type="button" class="option ${answers[index]===i?'selected':''}" data-answer="${i}">${'ABC'[i]}. ${option}</button>`).join('')}</div>`;if(answers[index]!==undefined){let correct=answers[index]===s.correct;content+=`<div class="feedback ${correct?'good':'try'}"><strong>${correct?'✓ Correct!':'↻ Try again!'}</strong><br>${correct?s.explanation:'Use your ladder: locate the starting unit, count steps, then move the decimal.'}${correct&&s.digit?`<br><br><strong>Code digit revealed: ${s.digit}</strong>`:''}</div>`;}if(s.digit){content+=`<div class="digits" aria-label="Secret code progress">${slides.filter(x=>x.digit).map(x=>`<div class="digit">${completed[slides.indexOf(x)]?x.digit:'?'}</div>`).join('')}</div>`;}}
slideEl.innerHTML=content;slideEl.querySelectorAll('[data-answer]').forEach(btn=>btn.addEventListener('click',()=>{const choice=Number(btn.dataset.answer);answers[index]=choice;if(choice===s.correct)completed[index]=true;render();}));prev.disabled=index===0;next.disabled=!!s.q&&!completed[index];next.textContent=index===slides.length-1?'Restart mission ↻':'Next →';}
prev.addEventListener('click',()=>{if(index>0){index--;render();window.scrollTo(0,0);}});next.addEventListener('click',()=>{if(index===slides.length-1){index=0;for(const k in answers)delete answers[k];for(const k in completed)delete completed[k];}else if(!slides[index].q||completed[index])index++;render();window.scrollTo(0,0);});render();
})();
</script></body></html>
