<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metric Mission: Crack the Code</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#35344b;background:#f7f5ff}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:790px;margin:30px auto;background:white;border:2px solid #e8def7;border-radius:25px;box-shadow:0 12px 35px #9d88b326;overflow:hidden}header{padding:22px 30px;background:#eee5ff}h1{font-size:clamp(25px,4vw,37px);margin:5px 0}h2{margin-top:0}section{padding:30px}p,li{line-height:1.65}.tag{font-size:12px;font-weight:800;letter-spacing:.13em;color:#71569c}.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:20px 0}.ladder div{background:#f1eaff;padding:12px 3px;text-align:center;border-radius:10px;font-size:clamp(10px,2vw,15px)}.ladder .base{background:#d8f1ed;font-weight:bold}button{border:0;border-radius:13px;padding:13px 22px;background:#8d6bc0;color:white;font-size:16px;font-weight:700;cursor:pointer}button:hover{background:#7455a9}button:disabled{opacity:.45;cursor:not-allowed}input{font-size:20px;padding:12px;width:min(100%,280px);border:2px solid #d6c5ed;border-radius:10px}input:focus{outline:3px solid #dfcff5}.progress{height:9px;background:#e3d9f0}.fill{height:100%;background:#83cfc5;transition:width .3s}.hint{background:#fff3dc;padding:15px;border-radius:12px;margin:18px 0}.feedback{min-height:30px;font-weight:700}.ok{color:#257e66}.bad{color:#a14d67}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.secondary{background:#dbe9f9;color:#3c5470}.code{font-size:28px;letter-spacing:.35em;font-weight:900;color:#6e4b9f}.small{color:#6c6980;font-size:14px}@media(max-width:550px){body{padding:10px}section{padding:20px}.ladder{gap:2px}.ladder div{padding:10px 0}}
</style></head><body><main><header><div class="tag">8TH GRADE PHYSICAL SCIENCE • INDEPENDENT MISSION</div><h1>🔐 Metric Mission: Crack the Code</h1><div id="status">Learn • Practice • Unlock</div></header><div class="progress"><div class="fill" id="bar"></div></div><section id="view"></section></main><script>
const questions=[["4 m = ? cm",400,"Multiply meters by 100."],["2500 mL = ? L",2.5,"Divide milliliters by 1000."],["3 km = ? m",3000,"Multiply kilometers by 1000."],["75 cm = ? m",0.75,"Divide centimeters by 100."],["6 g = ? mg",6000,"Multiply grams by 1000."],["4200 mg = ? g",4.2,"Divide milligrams by 1000."],["0.8 L = ? mL",800,"Multiply liters by 1000."],["5.6 m = ? cm",560,"Multiply meters by 100."],["900 m = ? km",0.9,"Divide meters by 1000."],["12 cm = ? mm",120,"Multiply centimeters by 10."],["350 mm = ? cm",35,"Divide millimeters by 10."],["2.4 kg = ? g",2400,"Multiply kilograms by 1000."],["6800 g = ? kg",6.8,"Divide grams by 1000."],["0.06 m = ? cm",6,"Multiply meters by 100."],["7.5 L = ? mL",7500,"Multiply liters by 1000."],["A beaker holds 1.2 L. How many mL?",1200,"1 L is 1000 mL."],["A ribbon is 245 cm long. How many m?",2.45,"100 cm is 1 m."],["A sample has mass 0.45 kg. How many g?",450,"1 kg is 1000 g."],["A student walks 1.75 km. How many m?",1750,"1 km is 1000 m."],["A dropper has 35 mL. How many L?",0.035,"1000 mL is 1 L."],["A pencil is 14.2 cm. How many mm?",142,"1 cm is 10 mm."],["A rock has mass 8500 mg. How many g?",8.5,"1000 mg is 1 g."],["A tank has 0.025 kL. How many L?",25,"1 kL is 1000 L."],["A track is 1250 m. How many km?",1.25,"1000 m is 1 km."],["A bottle contains 2.05 L. How many mL?",2050,"Move the decimal 3 places right."]];let step=-2,solved=false,errors=0;const view=document.getElementById('view');function ladder(){return '<div class="ladder">'+['kilo','hecto','deka','BASE','deci','centi','milli'].map((x,i)=>'<div class="'+(i===3?'base':'')+'">'+x+'</div>').join('')+'</div>'}
function render(){let total=questions.length;document.getElementById('bar').style.width=Math.max(0,((step+2)/(total+2))*100)+'%';document.getElementById('status').textContent=step<0?'Mission briefing':step<total?'Question '+(step+1)+' of '+total:'Mission complete';
if(step===-2){view.innerHTML='<h2>Welcome, scientist! 🧪</h2><p>Your lab has been locked! To escape, master metric conversions and answer 25 challenges. You will earn a four-digit access code at the end.</p><div class="hint">✍️ Have your notes sheet and pencil ready. Write down the metric ladder, conversion rules, and worked examples as you go.</div><p><strong>Estimated time:</strong> 35–40 minutes. Work independently and at your own pace.</p><button onclick="next()">Begin mission →</button>';return}
if(step===-1){view.innerHTML='<h2>Mission Training: Metric System</h2><p>The metric system uses <strong>meters (m)</strong> for length, <strong>liters (L)</strong> for volume, and <strong>grams (g)</strong> for mass.</p>'+ladder()+'<p>Each step to the <strong>right</strong> makes the number 10 times bigger. Each step to the <strong>left</strong> makes it 10 times smaller. Count the jumps between prefixes, then move the decimal the same number of places.</p><div class="hint"><strong>Worked example 1:</strong> 4 m → cm is two steps right, so 4 × 100 = <strong>400 cm</strong>.<br><strong>Worked example 2:</strong> 2500 mL → L is three steps left, so 2500 ÷ 1000 = <strong>2.5 L</strong>.</div><p>✍️ Record any rules or examples that will help you later.</p><button onclick="next()">Start the 25 challenges →</button>';return}
if(step===total){view.innerHTML='<h2>🎉 Mission accomplished!</h2><p>You solved all 25 conversion challenges. Enter this access code in your mission notes:</p><p class="code">7294</p><p><strong>Reflection:</strong> Which conversion was most challenging? Explain one strategy that helped you.</p><p class="hint">Show your teacher your completed screen and your notes sheet.</p><button onclick="restart()">Restart mission</button>';return}
const q=questions[step];solved=false;view.innerHTML='<div class="tag">CHALLENGE '+String(step+1).padStart(2,'0')+' / '+total+'</div><h2>'+q[0]+'</h2><p>Use the metric ladder and your notes. Type only the number, without units.</p><label for="answer"><strong>Your answer</strong></label><div style="margin:12px 0"><input id="answer" type="number" step="any" inputmode="decimal" placeholder="Type a number" onkeydown="if(event.key===\'Enter\')check()"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button id="check" onclick="check()">Check answer</button><button class="secondary" onclick="hint()">Need a hint?</button><button id="continue" style="display:none" onclick="next()">Next challenge →</button></div><div id="tip"></div><p class="small">Remember: Every mistake is a chance to learn.</p>';document.getElementById('answer').focus()}
function check(){if(solved)return;let el=document.getElementById('answer'),v=Number(el.value),q=questions[step],f=document.getElementById('feedback');if(el.value.trim()===''){f.textContent='Enter a number first.';f.className='feedback bad';return}if(Math.abs(v-q[1])<1e-8){solved=true;f.textContent='✓ Correct! Great work.';f.className='feedback ok';document.getElementById('continue').style.display='inline-block';document.getElementById('check').disabled=true;el.disabled=true}else{errors++;f.textContent='Not quite. Check how many ladder steps you moved, then try again.';f.className='feedback bad'}}
function hint(){document.getElementById('tip').innerHTML='<div class="hint">💡 '+questions[step][2]+'</div>'}function next(){step++;render()}function restart(){step=-2;errors=0;render()}render();
</script></body></html>
